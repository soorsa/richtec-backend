on: push
name: 🚀 Deploy App core
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v6

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./core/
          server-dir: /core/ # change this to your target folder
          protocol: ftps
          port: 21
          security: loose
          timeout: 3000000 # 2 minutes (in milliseconds)
          log-level: verbose
          timeout_minutes: 30
          max_attempts: 3
          retry_wait_seconds: 10
          passive: true
          concurrency: 1 # Lower concurrency to reduce timeout risk

          # exclude: |
          #   **/.git*
          #   **/.git*/**
          #   **/.github/**
          #   **/.env
          #   **/.venv
          #   **/.venv/**
          #   **/static
          #   **/static/**
          #   **/README.md
          #   **/authentication
          #   **/authentication/**
          #   **/shop
          #   **/shop/**

